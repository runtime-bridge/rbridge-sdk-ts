name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rbridge-sdk-ts
      - uses: actions/checkout@v4
        with:
          repository: runtime-bridge/rbridge
          path: rbridge
      - uses: actions/setup-go@v5
        with:
          go-version-file: rbridge/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: make build fakeagent
        working-directory: rbridge
      - run: npm test
        working-directory: rbridge-sdk-ts

  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rbridge-sdk-ts
      - uses: actions/checkout@v4
        with:
          repository: runtime-bridge/rbridge
          path: rbridge
      - uses: actions/setup-go@v5
        with:
          go-version-file: rbridge/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make cross
        working-directory: rbridge
      - run: node scripts/build-packages.mjs --binaries ../rbridge/bin
        working-directory: rbridge-sdk-ts
      - name: Install into a fresh project and use the bundled rbridge
        run: |
          plat=$(node -p 'process.platform + "-" + process.arch')
          for d in rbridge-sdk-ts/dist/sdk "rbridge-sdk-ts/dist/$plat"; do (cd "$d" && npm pack --pack-destination "$GITHUB_WORKSPACE"); done
          mkdir app && cd app && npm init -y
          npm install --no-audit --no-fund ../rbridge-sdk-*.tgz "../rbridge-$plat-"*.tgz
          npx rbridge version
          npx rbridge init
          test -f .rbridge/config/config.yaml
          node -e 'import("@rbridge/sdk").then((m) => { if (!m.bundledBinary()) process.exit(1); console.log(m.projectHome()); })'
